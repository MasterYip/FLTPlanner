plannerID: 4

trajInit:
  # perpendicular to the ground (avoid collision detection)
  vLift: 0.014 # For trajopt
  # vLift: 0.018 # For raibert planner init traj
  vLiftNormalRandomize: 1.5 # Rand normal for RE-PLANNING (orthogonal disk randomization)
  hLift: 0.1
  trajTime: 2

misc:
  enableOptimizer: true
  reOptimize: false
  useCfgSpace: true # Do not change this (this file is for cfg space)
  useCfgCommand: true
  enableVis: true
  enableOptVis: true # Visualize the optimization process
  optVisRate: 20
  enableBenchmark: true
  # Benchmark result save path
  # benchmarkSavePath: /home/user/HexLabCodeSpace/planner_ws/src/legged_traj_planner/legged_traj_plan_examples/data/benchmark/optBenchmark.csv
  # robotProfilePath: /home/user/HexLabCodeSpace/planner_ws/src/legged_traj_planner/legged_traj_plan_examples/data/benchmark/robotProfile.csv
  benchmarkSavePath: /home/user/HexLabCodeSpace/planner_ws/src/analysis_scripts/benchmarking/data/optBenchmark2.csv
  robotProfilePath: /home/user/HexLabCodeSpace/planner_ws/src/analysis_scripts/benchmarking/data/robotProfile2.csv

StompPlanner:
  optimizer:
    stompNumTimesteps: 10
    stompStdDev1: 0.5
    stompStdDev2: 1.0
    stompStdDev3: 0.2
    stompNumIters: 300
    stompNumItersAfterValid: 0
    stompNumRollouts: 30
    stompMaxRollouts: 30
    stompCtrlCostWeight: 0.3
  penalty:
    smoothingFactor: 1.0e-1
    CollBall3Rad: 0.02
    CollBall3Weight: 2000.0
    FootCollExcludeBallRad: 0.06
    # FootCollExcludeBallSmoothRad: 0.02
