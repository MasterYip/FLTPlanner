# robotInterface: ElSpiderAirROS # IMPORTANT: load by launch file

# Interfaces Params
ElSpiderAirROS:
  urdfParamPath: /robot_description
  # Rviz
  jointStateTopic: joint_states
  jointNamePrefix: "" # empty
  odomChildFrame: base
  odomParentFrame: odom
  enableVis: true
  # Feedback & Command
  jointStateFdbTopic: /hexapod/joint_state_fdb
  footStateFdbTopic: /hexapod/foot_state_fdb
  bodyStateFdbTopic: /base_odom
  footCmdTopic: /hexapod/hlc/foot_cmd_track
  jointCmdTopic: /hexapod/hlc/joint_cmd_track
  # Control Params
  # sim: true # IMPORTANT: load by launch file
  jointKpSim: [1500, 3000, 3000]
  jointKdSim: [5, 7.5, 7.5]
  jointKpHardware: [0.15, 0.15, 0.15]
  jointKdHardware: [1.0, 1.0, 1.0]

ElSpiderAirROSVMC:
  urdfParamPath: /robot_description
  # Rviz
  jointStateTopic: joint_states
  jointNamePrefix: "" # empty
  odomChildFrame: base
  odomParentFrame: odom
  enableVis: true
  # Feedback & Command
  jointStateFdbTopic: /hexapod/joint_state_fdb
  footStateFdbTopic: /hexapod/foot_state_fdb
  bodyStateFdbTopic: /base_odom
  footCmdTopic: /hexapod/hlc/foot_cmd_track
  jointCmdTopic: /hexapod/hlc/joint_cmd_track
  # sim: true # IMPORTANT: load by launch file
  # Control Params (not used in VMC)
  jointKpSim: [1500, 3000, 3000]
  jointKdSim: [5, 7.5, 7.5]
  jointKpHardware: [0.15, 0.15, 0.15]
  jointKdHardware: [1.0, 1.0, 1.0]
  # VMC Params
  expPoseTopicName: /exp_odom
  expFootStateTopicName: /exp_foot_state
  expJointStateTopicName: /exp_joint_state


ElSpiderAirDummy:
  urdfParamPath: /robot_description
  jointStateTopic: joint_states
  jointNamePrefix: "" # empty
  odomChildFrame: base
  odomParentFrame: odom
  enableVis: true
  nominalFootPos: [0.35, -0.23, -0.24,
                0.05, -0.29, -0.24,
                -0.35, -0.23, -0.24,
                0.35, 0.23, -0.24,
                0.05, 0.29, -0.24,
                -0.35, 0.23, -0.24]
  nominalFootPosShift: [0, 0.10, 0]
  initBodyPose: [0, 0, 0.24, 0, 0, 0]

# Hexapod201 Interfaces (Simplified - no urdf/kinematics)
Hexapod201Dummy:
  urdfParamPath: /robot_description
  jointStateTopic: joint_states
  jointNamePrefix: "" # empty
  odomChildFrame: base
  odomParentFrame: odom
  enableVis: true
  # Hexapod201 nominal foot positions (6 legs) - converted from Python constants (mm to m)
  # Mapping: Foot201 4->0, Foot201 5->1, Foot201 6->2, Foot201 1->3, Foot201 2->4, Foot201 3->5
  nominalFootPos: [0.660, -0.9962, -0.405,   # Foot201 4 (FootElAir 0)
                   0.00, -1.2512, -0.405,    # Foot201 5 (FootElAir 1)
                   -0.660, -0.9962, -0.405,  # Foot201 6 (FootElAir 2)
                   0.660, 0.9962, -0.405,    # Foot201 1 (FootElAir 3)
                   0.00, 1.2512, -0.405,     # Foot201 2 (FootElAir 4)
                   -0.660, 0.9962, -0.405]   # Foot201 3 (FootElAir 5)
  nominalFootPosShift: [0, 0.0, 0]
  initBodyPose: [0, 0, 0.405, 0, 0, 0]

Hexapod201ROS:
  urdfParamPath: /robot_description
  # Topic names for communication with Python interface
  poseCommandTopic: /hexapod/pose_cmd
  pathCommandTopic: /hexapod/path_cmd
  footCommandTopic: /hexapod/foot_cmd
  currentPoseTopic: /hexapod/current_pose
  footStateTopic: /hexapod/foot_state
  # Frame names
  odomChildFrame: base
  odomParentFrame: odom
  # Hexapod201 nominal foot positions (6 legs) - same as dummy, converted from Python constants
  nominalFootPos: [0.660, -0.977, -0.500,   # Foot201 4 (FootElAir 0)
                   0.00, -1.232, -0.500,    # Foot201 5 (FootElAir 1)
                   -0.660, -0.977, -0.500,  # Foot201 6 (FootElAir 2)
                   0.660, 0.977, -0.500,    # Foot201 1 (FootElAir 3)
                   0.00, 1.232, -0.500,     # Foot201 2 (FootElAir 4)
                   -0.660, 0.977, -0.500]   # Foot201 3 (FootElAir 5)
  nominalFootPosShift: [0, 0.0, 0]
  initBodyPose: [0, 0, 0.500, 0, 0, 0]

# Shadow Hexapod201
Hexapod201Shadow:
  urdfParamPath: /shadow/robot_description
  jointStateTopic: /shadow/joint_states
  jointNamePrefix: shadow
  odomChildFrame: shadowbase
  odomParentFrame: odom
  enableVis: true
  # Same as main Hexapod201 (not used for shadow):
  nominalFootPos: [0.30, -0.20, -0.22,
                   0.00, -0.25, -0.22,
                   -0.30, -0.20, -0.22,
                   0.30, 0.20, -0.22,
                   0.00, 0.25, -0.22,
                   -0.30, 0.20, -0.22]
  nominalFootPosShift: [0, 0.08, 0]
  initBodyPose: [0, 0, 0.22, 0, 0, 0]

