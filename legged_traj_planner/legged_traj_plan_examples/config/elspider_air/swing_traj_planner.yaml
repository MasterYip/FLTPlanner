plannerID: 0

trajInit:
  vLift: 0.02
  vLiftNormalRandomize: 0.5
  hLift: 0.15
  trajTime: 3 # Only affect init trajectory

misc:
  enableOptimizer: true
  useCfgSpace: false
  useCfgCommand: false
  enableVis: true
  enableOptVis: true
  optVisRate: 10
  enableBenchmark: false
  # Benchmark result save path
  benchmarkSavePath: /home/user/HexLabCodeSpace/planner_ws/src/analysis_scripts/benchmarking/data/optBenchmark2.csv
  robotProfilePath: /home/user/HexLabCodeSpace/planner_ws/src/analysis_scripts/benchmarking/data/robotProfile2.csv

LFTPlanner:
  optimizer:
    lengthPerPiece: 0.1 # FIXME: pieces > 3, the vLift effect is not obvious, when pieces = 3 it will lead to strange outcome
    allocSpeed: 0.02
    relCostTol: 1.0e-4
    smoothingFactor: 1.0e-2
    integralResolution: 16
  penalty:
    timeWeight: 0.001 # PROBLEM: too large or too small will leads to max-try error
    joint1PosMin: -0.785
    joint1PosMax: 0.785
    joint2PosMin: -0.5233
    joint2PosMax: 3.14
    joint3PosMin: -0.6978
    joint3PosMax: 3.925
    jointMaxVel: 5.0
    jointMaxAcc: 10.0
    jointPosWeight: 0.4
    jointVelWeight: 0.1
    jointAccWeight: 0.1
    CollBall1Rad: 0.12
    CollBall2Rad: 0.12
    CollBall3Rad: 0.03
    CollBall1Weight: 0.0
    CollBall2Weight: 0.0
    CollBall3Weight: 1
    FootCollExcludeBallRad: 0.05