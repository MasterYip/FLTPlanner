# NOTE: Hexapod201 Planner settings
misc:
  useCfgCommand: false # Simplified - no kinematics
  reOptimize: false
  reOptimizeMaxTry: 1000
  enableVis: true
  enableOptVis: false
  optVisRate: 12
  enableBenchmark: false
  OptBenchmarkSavePath: /home/user/CodeSpace/ROS/planner_ws/src/analysis_scripts/benchmarking/temp/OptBenchmark.csv
  ReachableBenchmarkSavePath: /home/user/CodeSpace/ROS/planner_ws/src/analysis_scripts/benchmarking/temp/ReachableBenchmark.csv
  robotProfilePath: /home/user/CodeSpace/ROS/planner_ws/src/analysis_scripts/benchmarking/temp/RobotProfileRecord.csv

StateSequencePlanner:
  rosRate: 50 # Lower rate for simplified planner
  stepTime: 1.5 # Slower stepping for tripod gait

  execOnKeyboardCmd: false

  # Tripod gait parameters (primary control method)
  tripodStepDuration: 0.6
  tripodStanceDuration: 0.3
  maxStepLength: 0.10
  maxYawChange: 0.5
  navStepDuration: 2.0
