# NOTE: Hexapod201 Planner settings
misc:
  useCfgCommand: false # Simplified - no kinematics
  reOptimize: false
  reOptimizeMaxTry: 1000
  enableVis: true
  enableOptVis: false
  optVisRate: 12
  enableBenchmark: false
  OptBenchmarkSavePath: /home/user/CodeSpace/ROS/planner_ws/src/analysis_scripts/benchmarking/temp/OptBenchmark.csv
  ReachableBenchmarkSavePath: /home/user/CodeSpace/ROS/planner_ws/src/analysis_scripts/benchmarking/temp/ReachableBenchmark.csv
  robotProfilePath: /home/user/CodeSpace/ROS/planner_ws/src/analysis_scripts/benchmarking/temp/RobotProfileRecord.csv

StateSequencePlanner:
  rosRate: 50 # Lower rate for simplified planner
  stepTime: 2.0 # Slower stepping for tripod gait
  navStepDuration: 2.0

  execOnKeyboardCmd: false

  # Tripod gait parameters (primary control method)
  tripodStepDuration: 0.6
  tripodStanceDuration: 0.3
  maxStepLength: 0.10
  maxYawChange: 0.5

  # Pose control parameters
  keepPoseHorizontal: true
  keepConstBaseFootZ: true # If ture, base height is kept constant too
  keepConstBaseFootZValue: -0.5

  # Gait planner configuration
  GaitPlanner:
    # Gait type: GAIT_2 (tripod), GAIT_3 (wave), GAIT_6 (single-leg)
    gaitType: "GAIT_2"
    stepDuration: 0.6
    stanceDuration: 0.3

    # Basic Raibert foothold planner settings
    Hexapod201RaibertFootholdPlanner:
      stepTime: 0.6
      stanceTime: 0.3
      velocityGainX: 0.5
      velocityGainY: 0.5
      velocityGainZ: 0.0

    # Terrain-aware Raibert planner settings
    Hexapod201TerrainAwareRaibertPlanner:
      stepTime: 0.6
      stanceTime: 0.3
      velocityGainX: 1.0
      velocityGainY: 1.0
      velocityGainZ: 0.0
      searchRadius: 0.5
      gridResolution: 0.05
      maxSearchIterations: 2000
      minFootholdHeight: -10.0 # Should not be used
