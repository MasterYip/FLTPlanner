
# NOTE: Planner settings override 
misc:
  useCfgCommand: true
  reOptimize: true
  reOptimizeMaxTry: 1000
  enableVis: true
  enableOptVis: true
  optVisRate: 12
  enableBenchmark: true
  OptBenchmarkSavePath: /home/user/HexLabCodeSpace/planner_ws/src/analysis_scripts/benchmarking/temp/OptBenchmark.csv
  ReachableBenchmarkSavePath: /home/user/HexLabCodeSpace/planner_ws/src/analysis_scripts/benchmarking/temp/ReachableBenchmark.csv
  robotProfilePath: /home/user/HexLabCodeSpace/planner_ws/src/analysis_scripts/benchmarking/temp/RobotProfileRecord.csv


StateSequencePlanner:
  rosRate: 100
  stepTime: 2
  cmdMctsSearchNodeNum: 300
  navMctsSearchNodeNum: 600
  cmdExtrapolatePointNum: 50
  cmdExtrapolateDeltaT: 0.01
  navExtrapolateSamplesNum: 100
  # only for FLTCfgPlanner
  enableReachableFiltering: false
  reachableFilterPoseMoveDis: 0.2
  reachableTravLayerName: "elevation_inpainted_trav"

  # Enable Reachability Check (if envableVis is True, output will be visualized) 
  enableReachableCheck: True

  swingTrajPreOpt: false
  shutdownAfterPreOpt: false
  execOnKeyboardCmd: false
  # Demo select
  # demoPath: # NOTE: offered by launch file
  savePlannedStates: false
  # Executing saved states on startup
  execSavedStates: true 

  # Benchmark for StateSequencePlanner
  OptBenchmarkSavePath: /home/user/HexLabCodeSpace/planner_ws/src/analysis_scripts/benchmarking/temp/StateSequencePlannerBenchmark.yaml