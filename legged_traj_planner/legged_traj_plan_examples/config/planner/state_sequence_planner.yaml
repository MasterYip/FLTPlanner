
# NOTE: Planner benchmark settings override 
misc:
  useCfgCommand: true
  reOptimize: true
  reOptimizeMaxTry: 1000
  enableVis: true
  enableOptVis: false
  optVisRate: 6
#   enableBenchmark: true
#   benchmarkSavePath: /home/user/HexLabCodeSpace/planner_ws/src/analysis_scripts/benchmarking/temp/SwingTrajPlannerBenchmark.csv
#   robotProfilePath: /home/user/HexLabCodeSpace/planner_ws/src/analysis_scripts/benchmarking/temp/RobotProfileRecord.csv


StateSequencePlanner:
  rosRate: 100
  stepTime: 4
  cmdMctsSearchNodeNum: 100
  navMctsSearchNodeNum: 600
  cmdExtrapolatePointNum: 50
  cmdExtrapolateDeltaT: 0.01
  navExtrapolateSamplesNum: 100
  # only for FLTCfgPlanner
  enableReachableFiltering: true
  reachableFilterPoseMoveDis: 0.05
  reachableTravLayerName: "reachable_trav"

  swingTrajPreOpt: false
  shutdownAfterPreOpt: false
  execOnKeyboardCmd: false
  # Demo select
  # demoPath: # NOTE: offered by launch file
  savePlannedStates: false
  # Executing saved states on startup
  execSavedStates: false 

  # Benchmark
  benchmarkSavePath: /home/user/HexLabCodeSpace/planner_ws/src/analysis_scripts/benchmarking/temp/StateSequencePlannerBenchmark.yaml