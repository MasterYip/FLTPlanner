
# NOTE: Planner benchmark settings override 
misc:
  useCfgCommand: true
  reOptimize: false
  reOptimizeMaxTry: 3
  enableVis: false
  enableOptVis: false
  optVisRate: 12
  enableBenchmark: true
  OptBenchmarkSavePath: /home/raymon/Documents/CodeSpace/ROS_ws/planner_ws/src/analysis_scripts/benchmarking/temp/OptBenchmark.csv
  ReachableBenchmarkSavePath: /home/raymon/Documents/CodeSpace/ROS_ws/planner_ws/src/analysis_scripts/benchmarking/temp/ReachableBenchmark.csv
