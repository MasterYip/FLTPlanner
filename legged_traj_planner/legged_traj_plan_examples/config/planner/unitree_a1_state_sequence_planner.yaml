
# NOTE: Planner benchmark settings override 
misc:
  useCfgCommand: true
  reOptimize: false
  reOptimizeMaxTry: 3
  enableVis: true
  enableOptVis: false
  optVisRate: 12
  enableBenchmark: true
  OptBenchmarkSavePath: /home/user/CodeSpace/ROS/planner_ws/src/analysis_scripts/benchmarking/temp/OptBenchmark.csv
  ReachableBenchmarkSavePath: /home/user/CodeSpace/ROS/planner_ws/src/analysis_scripts/benchmarking/temp/ReachableBenchmark.csv
  robotProfilePath: /home/user/CodeSpace/ROS/planner_ws/src/analysis_scripts/benchmarking/temp/RobotProfileRecord.csv

# Unitree A1 State Sequence Planner Configuration
A1StateSequencePlanner:
  # ROS Settings
  rosRate: 100
  stepTime: 0.4
  
  # Trot Gait Parameters
  trotStepDuration: 0.4
  trotStanceDuration: 0.2
  nominalBodyHeight: 0.20
  
  # Reachability Check
  enableReachableCheck: true
  reachableCheckSize: 30
  
  # Trajectory Optimization
  swingTrajPreOpt: false
  shutdownAfterPreOpt: false
  execOnKeyboardCmd: false
  
  # Demo and Benchmark Settings
  demoPath: ""
  savePlannedStates: false
  execSavedStates: false
  OptBenchmarkSavePath: /home/user/CodeSpace/ROS/planner_ws/src/analysis_scripts/benchmarking/temp/StateSequencePlannerBenchmark.yaml