resolution: 0.1           # 网格地图分辨率
min_height: 0.0             # 
max_height: 1.0
min_height_ceiling: 1
max_height_ceiling: 1
elevation_layer: elevation_inpainted
ceiling_layer: ceiling
map_position_x: 3.2
map_position_y: 0.0

GridMapInterface: # NOTE: this override config in perception_interface.yaml
  normalTangentCrtic: 0.5
  topicName: /elevation_mapping/elevation_map_raw
  topicNameCeiling: /elevation_mapping/elevation_map_raw
  groundLayerName: elevation_inpainted
  sdfEnable: false
  travErodeRad: 1.7
  centerBoxAlwaysTrav: true
  centerBoxWidth: 2.0
  centerBoxLen: 2.0

